services:
  postgres_main:
    image: postgres:18
    container_name: postgres_main
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_MAIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_MAIN_PASSWORD:-practice}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres_main_data:/var/lib/postgresql
    networks:
      - data_stack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres_ml:
    image: postgres:18
    container_name: postgres_ml
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ML_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ML_PASSWORD:-practice}
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres_ml_data:/var/lib/postgresql
    networks:
      - data_stack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-practice}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./data/clickhouse_data:/var/lib/clickhouse
      - ./data/clickhouse_logs:/var/log/clickhouse-server
    networks:
      - data_stack
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  mongodb:
    image: mongo:8
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-practice}
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodb_data:/data/db
    networks:
      - data_stack
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-practice}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-practice}
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis_data:/data
    networks:
      - data_stack
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  data_stack:
    driver: bridge
